[package]
name = "app-windows-tree-size"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Analiza tus discos y te ayuda a liberar espacio"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
trash = "5"
scanner = { path = "../crates/scanner" }
